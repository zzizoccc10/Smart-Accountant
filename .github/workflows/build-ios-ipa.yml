# ============================================================================
# بناء ملف IPA لتطبيق «المحاسب السهل» على أجهزة macOS سحابياً (مجاناً)
# لا يحتاج أن تمتلك Mac — يقوم GitHub بتشغيله على Mac حقيقي.
#
# الاستخدام:
#   1) ارفع الكود إلى مستودع GitHub.
#   2) من تبويب Actions اختر «Build iOS IPA» ثم Run workflow.
#   3) عند الانتهاء نزّل ملف IPA من قسم Artifacts.
#
# التوقيع:
#   - بدون أسرار: يُنتج IPA غير موقّع (unsign) للتوقيع لاحقاً بـ Sideloadly/AltStore.
#   - مع أسرار (اختياري): توقيع كامل جاهز للتثبيت مباشرة.
# ============================================================================
name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: 'بناء IPA غير موقّع'
        type: boolean
        default: true
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (3.35.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable iOS & disable analytics
        run: |
          flutter config --enable-ios --no-analytics
          flutter config --no-cli-animations

      - name: Get dependencies
        run: flutter pub get

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ لم يتم العثور على Runner.app"; exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry EasyAccountant-unsigned.ipa Payload
          echo "✅ تم إنشاء IPA:"
          ls -lh EasyAccountant-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyAccountant-ios-ipa
          path: build/ios/ipa/EasyAccountant-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
