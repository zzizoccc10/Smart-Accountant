name: easy_accountant
description: "المحاسب السهل — نظام محاسبي ERP متكامل يعمل دون اتصال."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: 6.1.5+1

  # Local Storage (Web + Android compatible)
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Charts
  fl_chart: ^0.69.0

  # Reports & Printing
  pdf: ^3.11.1
  printing: ^5.13.2
  barcode: ^2.2.8
  barcode_widget: ^2.0.4

  # Import / Export (Excel & CSV) — web compatible
  csv: ^6.0.0
  file_picker: ^8.3.7
  excel: ^4.0.6
  url_launcher: ^6.3.2

  # File sharing (backup/PDF share via system sheet incl. WhatsApp)
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Permissions & Contacts
  permission_handler: ^11.4.0
  flutter_contacts: ^1.1.9+2

  # Barcode / QR scanning via camera
  mobile_scanner: ^5.2.3

  # Local notifications
  flutter_local_notifications: ^20.1.0

  # ==========================================================================
  # Firebase (Cloud Sync + Auth + Push Notifications)
  # --------------------------------------------------------------------------
  # ⚠️ نسخ مقفلة (LOCKED) — متوافقة مع Flutter 3.35.4 / Dart 3.9.2.
  #    لا تُحدّثها إلى نسخ أحدث لتفادي مشاكل التوافق.
  # ==========================================================================
  firebase_core: 3.6.0            # نواة Firebase (إلزامي)
  firebase_auth: 5.3.1            # المصادقة (المستخدمون)
  cloud_firestore: 5.4.3          # قاعدة بيانات سحابية (المزامنة)
  firebase_messaging: 15.1.3      # الإشعارات السحابية (FCM)
  firebase_storage: 12.3.2        # تخزين الملفات (المرفقات)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# ============================================================================
# تجاوزات التبعيات (Dependency Overrides)
# ----------------------------------------------------------------------------
# permission_handler 11.4.0 يعتمد على permission_handler_apple ^9.4.6
# لكن الإصدار 9.4.6+ يستخدم الرمز CNAuthorizationStatusLimited الجديد في
# iOS 18 SDK، مما يفشل البناء على Xcode الأقدم (iOS 17 SDK) برسالة:
#   "Use of undeclared identifier 'CNAuthorizationStatusLimited'"
# لذلك نُثبّت 9.4.5 (آخر نسخة متوافقة مع Xcode القديم — لا تستخدم هذا الرمز).
# ============================================================================
dependency_overrides:
  permission_handler_apple: 9.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
